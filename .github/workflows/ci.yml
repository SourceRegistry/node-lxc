name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.triplet }})
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            triplet: x86_64-linux-gnu
          - runner: ubuntu-24.04-arm
            triplet: aarch64-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org/"

      - name: Install system dependencies
        run: sudo apt-get update -y && sudo apt-get install -y g++ cmake lxc lxc-dev

      - name: Install npm dependencies
        run: npm install

      - name: Configure and build native addon
        run: npx node-gyp configure && npx node-gyp build

      - name: Compile TypeScript
        run: npx tsc --build

      - name: Run tests
        run: npm test

      - name: Upload native addon
        uses: actions/upload-artifact@v4
        with:
          name: addon-${{ matrix.triplet }}
          path: build/Release/node-lxc.node
          if-no-files-found: error

  package:
    name: Assemble package
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install npm dependencies
        run: npm install

      - name: Compile TypeScript
        run: npx tsc --build

      - name: Download x86_64-linux-gnu addon
        uses: actions/download-artifact@v4
        with:
          name: addon-x86_64-linux-gnu
          path: package/bin/x86_64-linux-gnu

      - name: Download aarch64-linux-gnu addon
        uses: actions/download-artifact@v4
        with:
          name: addon-aarch64-linux-gnu
          path: package/bin/aarch64-linux-gnu

      - name: Stage package files
        run: |
          mkdir -p package/lib
          cp -r build/tsc/* package/lib/
          cp package.json LICENSE README.md package/

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: package/
          if-no-files-found: error

  release:
    name: Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/alpha')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org/"

      - name: Install npm dependencies
        run: npm install

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: package

      - name: Run semantic-release
        run: ./node_modules/.bin/semantic-release

  deploy-docs:
    name: Deploy Docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm install

      - name: Build documentation
        run: npm run docs:build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./generated/docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
